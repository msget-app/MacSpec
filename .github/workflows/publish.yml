name: Publish

on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  verify-main:
    name: Require tagged commit on main
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag belongs to main
        shell: bash
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" refs/remotes/origin/main; then
            echo '::error::Publishing requires a tag pointing to a commit on main.'
            exit 1
          fi

  build:
    name: Build release assets
    needs: verify-main
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: MacSpec-macos-universal
          path: dist

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes \
            dist/MacSpec-macos-universal.tar.gz dist/SHA256SUMS
